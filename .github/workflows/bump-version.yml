name: Bump version
on:
  push:
    branches: [main]
jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump patch
        run: |
          python3 - << 'PY'
          import pathlib
          import re
          path = pathlib.Path("version.txt")
          current = path.read_text(encoding="utf-8").strip() if path.exists() else "0.0.0"
          major, minor, patch = current.split(".")
          nxt = major + "." + minor + "." + str(int(patch) + 1)
          path.write_text(nxt + "\n", encoding="utf-8")
          html = pathlib.Path("index.html")
          text = html.read_text(encoding="utf-8")
          updated = re.sub(r'(id="version">v)[0-9.]+', r"\g<1>" + nxt, text, count=1)
          if updated == text:
              raise SystemExit("version marker missing")
          html.write_text(updated, encoding="utf-8")
          PY
      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bump version to $(tr -d '\n' < version.txt) [skip version]"
          git push
