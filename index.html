<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gachon campus — two controllers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Roboto, "Segoe UI", sans-serif; color: #fff; }
    button { color: #fff; border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; cursor: pointer; }
    body.touring #hud, body.touring #status, body:has(#route.open) #status { display: none; }
    body > button { left: auto !important; right: 16px !important; bottom: 16px !important; transform: none !important; }
    body.touring > button { bottom: auto !important; top: 16px !important; }
    #hud { position: fixed; left: 16px; bottom: 16px; z-index: 2; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 180px); flex-wrap: wrap; }
    #line { display: none; }
    #line:not(:empty) { display: block; flex: 1 1 220px; background: rgba(12,16,22,.82); border-radius: 14px; padding: 10px 12px; }
    #hud button { background: rgba(12,16,22,.82); border: 1px solid rgba(255,255,255,.16); }
    #version { position: fixed; top: 16px; left: 16px; z-index: 6; font-size: 12px; letter-spacing: .04em; color: #f4f7fb; background: rgba(12,16,22,.72); border-radius: 999px; padding: 4px 8px; pointer-events: none; }
    #status { position: fixed; top: 48px; left: 16px; z-index: 2; max-width: min(420px, calc(100% - 32px)); color: #f4f7fb; background: rgba(12,16,22,.72); border-radius: 14px; padding: 8px 12px; font-size: 14px; line-height: 1.4; }
    #lab, #tour, #route { display: none; }
    #lab.open, #tour.open, #route.open { display: block; }
    #lab, #tour { position: fixed; left: 16px; bottom: 16px; top: auto; z-index: 4; width: min(420px, calc(100vw - 32px)); max-height: min(78vh, 680px); overflow: auto; padding: 16px; border-radius: 22px; background: rgba(12,16,22,.88); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
    #tour-head, #lab-head { display: flex; align-items: center; gap: 12px; }
    #speaker, #tour-speaker { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.85); flex: none; }
    #speaker img, #tour-speaker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #speaker.talking, #tour-speaker.talking { animation: talk 0.7s ease-in-out infinite; }
    @keyframes talk { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
    #tour-meta { flex: 1; min-width: 0; }
    #tour-progress { font-size: 18px; font-weight: 700; line-height: 1.35; }
    #tour-score, #tour-score:empty { margin: 0; }
    #tour-score:not(:empty) { margin-top: 2px; color: #d6ecff; font-size: 14px; }
    #tour-again { flex: none; background: transparent; color: #f0d7a2; border: 1px solid rgba(240,215,162,.5); padding: 8px 10px; font-size: 14px; }
    #ko, #sub, #tour-ko, #tour-text { background: transparent; padding: 0; }
    #ko, #tour-ko { margin-top: 14px; font-size: 18px; line-height: 1.45; }
    #sub, #tour-text { margin-top: 6px; color: #d6ecff; font-size: 15px; line-height: 1.45; }
    #mic, #tour-next, #tour-home { width: 100%; margin-top: 12px; min-height: 48px; font-size: 17px; }
    #mic, #start-tour { background: #0e6b4f; }
    #tour-next { background: #0e6b4f; }
    #tour-home, #open-route { background: #5a3e16; }
    #heard { color: #f4f7fb; margin-top: 8px; font-size: 14px; }
    #heard:empty { display: none; }
    #choices, #tour-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    #choices button, #tour-choices button { text-align: left; min-height: 48px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    #tour-choices button:disabled, #choices button:disabled { opacity: .55; }
    #route { position: fixed; right: 16px; top: 16px; z-index: 4; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 12px; border-radius: 22px; background: rgba(12,16,22,.9); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
    #route .route { margin-top: 8px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.04); }
    #route .route.on { background: rgba(230,168,23,.16); }
    #route .card { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; background: transparent; padding: 8px; }
    #route .card.on { background: #e6a817; color: #1a1204; }
    #route .name { font-size: 17px; font-weight: 700; }
    #route .count { font-size: 13px; opacity: .8; }
    #route .stops { margin: 4px 8px 2px; color: #d6ecff; font-size: 13px; line-height: 1.4; }
    #route .voices { display: none; flex-wrap: wrap; gap: 6px; margin: 4px 8px 0; }
    #route .voices.open { display: flex; }
    #route .voice-current { width: calc(100% - 16px); margin: 4px 8px 0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    #route .voices button { flex: 1 1 30%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
    #tour-prize { margin-top: 14px; padding: 16px 12px 14px; border-radius: 18px; text-align: center; }
    #tour-prize.win { background: rgba(230,168,23,.18); }
    #tour-prize.lose { background: rgba(255,255,255,.06); }
    #tour-prize .gift { width: 64px; height: 48px; margin: 0 auto 8px; position: relative; background: #d23b3b; border-radius: 4px; box-shadow: inset 0 16px 0 #e24a4a; }
    #tour-prize .gift:before { content: ""; position: absolute; left: 28px; top: -10px; bottom: -4px; width: 8px; background: #ffd15c; }
    #tour-prize .gift:after { content: ""; position: absolute; left: 16px; top: -18px; width: 14px; height: 14px; border: 4px solid #ffd15c; border-bottom: 0; border-radius: 14px 14px 0 0; }
    #tour-prize.lose .gift { display: none; }
    #tour-prize .prize-label { font-size: 22px; font-weight: 700; }
    #tour-prize.win .prize-label { color: #ffd15c; }
    #tour-prize.lose .prize-label { color: #d5dde6; font-size: 28px; }
    #route .voices button.on-f, #route .voice-current.on-f { background: #c2185b; border-color: transparent; }
    #route .voices button.on-m, #route .voice-current.on-m { background: #1565c0; border-color: transparent; }
    #route .quiz { width: 100%; margin-top: 10px; background: transparent; border: 1px solid rgba(255,255,255,.2); color: #f0d7a2; }
    #audience { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; width: min(360px, calc(100vw - 32px)); padding: 18px; border-radius: 22px; background: rgba(12,16,22,.94); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
    #audience.open { display: block; }
    #audience .title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    #audience .roles { display: flex; flex-direction: column; gap: 10px; }
    #audience .roles button { width: 100%; min-height: 52px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-size: 18px; }
    #audience .roles button.on { background: #e6a817; color: #1a1204; border-color: transparent; }
    #tour-muhan { display: none !important; position: fixed; left: 50%; top: 48%; transform: translate(-50%, -50%); z-index: 7; pointer-events: none; margin: 0; padding: 0; }
    #tour-muhan.open { display: block !important; }
    #tour-muhan img { display: block; width: min(56vw, 460px); height: min(56vw, 460px); object-fit: cover; border-radius: 28px; background: #d7ecff; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
    #tour-muhan.talking img { animation: muhanTalk .28s ease-in-out infinite; }
    @keyframes muhanTalk { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.96) translateY(4px); } }
    #tour-muhan .muhan-line { display: none !important; }
    #spot-box { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.78); align-items: center; justify-content: center; padding: 16px; }
    #spot-box.open { display: flex; }
    #spot-box .panel { width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 20px; background: rgba(12,16,22,.96); padding: 14px; }
    #spot-box .spot-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    #spot-box .spot-line { color: #d6ecff; font-size: 15px; line-height: 1.45; margin-bottom: 10px; }
    #spot-box .spot-photos { display: flex; gap: 8px; overflow-x: auto; }
    #spot-box .spot-photos img { height: min(42vh, 320px); width: auto; border-radius: 12px; background: #111; }
    #spot-box .spot-close { width: 100%; margin-top: 12px; background: #0e6b4f; min-height: 48px; }
  </style>
</head>
<body>
  <div id="version">v0.0.5</div>
  <div id="status">Đang tải ảnh campus…</div>
  <div id="hud">
    <div id="line"></div>
    <button id="speak" type="button">Tay trái: nói</button>
    <button id="back" type="button">Tay trái: về</button>
    <button id="open-lab" type="button">Lab</button>
    <button id="open-route" type="button">Lộ trình</button>
    <button id="start-tour" type="button">Bắt đầu</button>
  </div>
  <div id="tour">
    <div id="tour-head">
      <div id="tour-speaker"><img src="img/hanbok.jpg" alt="Người mặc hanbok"></div>
      <div id="tour-meta">
        <div id="tour-progress"></div>
        <div id="tour-score"></div>
      </div>
      <button id="tour-again" type="button" hidden>Làm lại</button>
    </div>
    <div id="tour-ko"></div>
    <div id="tour-text"></div>
    <div id="tour-prize" hidden><div class="gift"></div><div class="prize-label"></div></div>
    <div id="tour-choices"></div>
    <button id="tour-next" type="button" hidden>Tiếp</button>
    <button id="tour-home" type="button" hidden>Về</button>
  </div>
  <div id="tour-muhan">
    <img src="img/muhan-proud.jpg" alt="Muhan">
  </div>
  <div id="audience">
    <div class="title">Bạn là:</div>
    <div class="roles">
      <button type="button" data-role="parent">Phụ huynh</button>
      <button type="button" data-role="student">Học sinh</button>
    </div>
  </div>
  <div id="spot-box">
    <div class="panel">
      <div class="spot-title"></div>
      <div class="spot-line"></div>
      <div class="spot-photos"></div>
      <button type="button" class="spot-close">Đóng</button>
    </div>
  </div>
  <div id="route"><div id="route-list"></div></div>
  <div id="lab">
    <div id="speaker"><img src="img/hanbok.jpg" alt="Người mặc hanbok"></div>
    <div id="ko"></div>
    <div id="sub"></div>
    <button id="mic" type="button">Nói tiếng Việt</button>
    <div id="heard"></div>
    <div id="choices"></div>
  </div>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js"
    import { VRButton } from "https://unpkg.com/three@0.170.0/examples/jsm/webxr/VRButton.js"

    const LINE = document.querySelector("#line")
    const STATUS = document.querySelector("#status")

    const PLACES = {
      overview: {
        sky: "01",
        title: "Toàn trường",
        ko: "여기는 대한민국 성남시에 있는 가천대학교 글로벌 캠퍼스예요. 가천 베트남은 반도체 기술을 가르치며, FPT 대학교와 가천대학교가 함께 운영해요. 오늘은 호치민 레꽝딘 485번지 캠퍼스에 있고, 다른 캠퍼스는 하노이에 있어요.",
        line: "Đây là Global Campus của Đại học Gachon, ở thành phố Seongnam, Hàn Quốc. Gachon Vietnam đào tạo Công nghệ bán dẫn, liên kết Đại học FPT và Đại học Gachon. Hôm nay mình đang ở cơ sở TP.HCM, 485 Lê Quang Định. Cơ sở kia ở Hà Nội.",
        audio: "audio/tour-overview.wav",
        pitch: -18
      },
      vision: {
        sky: "03",
        title: "Vision Tower Plaza",
        ko: "역 출구가 비전타워로 바로 이어져요. 역과 학교를 잇는 지하 통로가 있어서 비나 해를 걱정하지 않아도 돼요. 이 건물에는 연구소도 있어요. 예를 들어 바이오헬스케어 융합연구원은 비전타워에서 개원했어요.",
        line: "Lối ra của ga nối thẳng vào Vision Tower, và một đường hầm ngầm nối ga với trường, nên đi học không lo mưa nắng. Tòa nhà này cũng là nơi trường đặt các viện nghiên cứu, ví dụ Viện Nghiên cứu Hội tụ Biohealthcare khai trương tại Vision Tower.",
        en: "The station exit leads straight into Vision Tower, and an underground passage connects the station to the campus, so the walk to class stays out of the rain and sun. This building also houses the university's research institutes. For example, the Biohealthcare Convergence Research Institute opened in Vision Tower.",
        audio: "audio/r8-vision.wav",
        pitch: -10
      },
      fountain: {
        sky: "04",
        title: "Station Fountain Plaza",
        ko: "여기는 학교로 들어오는 문이에요. 가천대역은 수인분당선이고, 가천 글로벌 캠퍼스를 바로 다녀요. 이 노선은 서울 중심으로 가요. 서울 남쪽에서 학교까지 버스나 지하철로 약 30분에서 40분이에요. 캠퍼스는 조용하고, 오가기도 편해요.",
        line: "Đây là cửa ngõ vào trường. Ga Gachon University thuộc tuyến Suin–Bundang, phục vụ trực tiếp Global Campus của Gachon, và tuyến này chạy về hướng trung tâm Seoul. Từ nam Seoul đến trường mất khoảng 30-40 phút bằng bus hoặc tàu điện, sinh viên vừa học ở khuôn viên yên tĩnh vừa dễ đi lại.",
        en: "This is the gateway into the university. Gachon University station is on the Suin–Bundang line, serves the Gachon Global Campus directly, and the line runs toward central Seoul. From southern Seoul the campus is about 30 to 40 minutes by bus or train. Students study on a quiet campus and can still get around easily.",
        audio: "audio/r8-fountain.wav",
        pitch: 0

      ai: {
        sky: "01",

        line: "Tòa nhà này có phòng học và văn phòng nghiên cứu của các ngành AI và Phần mềm, Kỹ thuật máy tính và các chương trình bán dẫn thế hệ mới. Ngoài ra, Gachon được giới thiệu là trường đại học đầu tiên trên thế giới thành lập College of Semiconductors, năm 2024. Trường còn có phòng sạch thực hành các quy trình như khắc, lắng đọng và mài phẳng, được mở rộng từ 225 lên 360 m².",

        pitch: -18,
        flat: true

      maker: {
        sky: "02",
        title: "Maker Space",
        ko: "메이커 스페이스는 학생이 실제 장비로 시제품을 만드는 창작 작업실이에요. 2020년 경기도 자료에는 약 1,178제곱미터이고, 현대 장비 60종, 전문 구역 19곳이 있다고 해요.",

        pitch: 0,
        yaw: 0

    const MORE_SCENES = [
      ["05", "OIS Center", "OIS 센터", "Trung tâm OIS"],
      ["06", "Electronic Information Library", "전자정보도서관", "Thư viện thông tin điện tử"],

      ["10", "Gachon Hall", "가천관", "Gachon Hall"],

      ["13", "Residence Hall Overview", "기숙사 전경", "Toàn cảnh ký túc xá"],

      ["16", "Baengbong", "백봉 스터디 카페", "Baengbong, phòng học kiểu quán"],

    const SCENE_LINES = {
      "05": {
        ko: "OIS 센터는 외국인 유학생의 수강, 증명서, 장학금, 학생 업무를 돕는 곳이에요.",

    function pinVector(athDeg, atvDeg, radius) {
      const ath = THREE.MathUtils.degToRad(-athDeg)
      const atv = THREE.MathUtils.degToRad(atvDeg)
      const cosAtv = Math.cos(atv)
      return new THREE.Vector3(
        Math.sin(ath) * cosAtv * radius,
        -Math.sin(atv) * radius,
        -Math.cos(ath) * cosAtv * radius
      )
    }

        })
      }
      return skyJobs[id]
    }

    async function loadOneSky(id) {
      const faces = {}
      for (const face of ["f", "b", "l", "r", "u", "d"]) {
        const texture = await loadTexture(`./pano/${id}_${face}.jpg`)
        texture.wrapS = THREE.RepeatWrapping
        texture.repeat.x = -1
        faces[face] = texture
      }
      const mesh = makeSky(faces)
      mesh.visible = false
      skies[id] = mesh
      scene.add(mesh)
    }

    function releaseSkies(keep) {
      for (const id of Object.keys(skies)) {
        if (keep.has(id)) continue
        const mesh = skies[id]
        scene.remove(mesh)
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material]
        for (const material of materials) {
          if (material.map) material.map.dispose()
          material.dispose()
        }
        mesh.geometry.dispose()
        delete skies[id]
      }
    }

    function paintCaption(text) {
      const canvas = caption.userData.canvas
      const ctx = canvas.getContext("2d")
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = "rgba(0,0,0,0.72)"
      ctx.fillRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = "#ffffff"
      ctx.font = "42px Arial"
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      const words = text.split(" ")
      const lines = ["", ""]
      let row = 0
      for (const word of words) {
        const trial = (lines[row] + " " + word).trim()
        if (row === 0 && ctx.measureText(trial).width > 960) row = 1
        lines[row] = (lines[row] + " " + word).trim()
      }
      ctx.fillText(lines[0], 512, lines[1] ? 96 : 128)
      if (lines[1]) ctx.fillText(lines[1], 512, 160)
      caption.userData.texture.needsUpdate = true
      caption.visible = true
      captionTimer = 12
    }

    function wrapLines(ctx, text, maxWidth, maxLines) {
      const words = text.split(/\s+/).filter(Boolean)
      const lines = []
      let row = ""
      for (const word of words) {
        const trial = (row + " " + word).trim()
        if (row && ctx.measureText(trial).width > maxWidth && lines.length < maxLines - 1) {
          lines.push(row)
          row = word
        } else row = trial
      }
      if (row) lines.push(row)
      return lines.slice(0, maxLines)
    }

    function makeTextCard(width, height, canvasWidth, canvasHeight, font, maxLines) {
      const canvas = document.createElement("canvas")
      canvas.width = canvasWidth

      const texture = new THREE.CanvasTexture(canvas)
      texture.colorSpace = THREE.SRGBColorSpace
      const mesh = new THREE.Mesh(

      )
      mesh.userData.canvas = canvas
      mesh.userData.texture = texture
      mesh.userData.font = font
      mesh.userData.maxLines = maxLines
      mesh.visible = false
      return mesh
    }

    function fillRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2)
      ctx.beginPath()
      ctx.moveTo(x + r, y)
      ctx.arcTo(x + width, y, x + width, y + height, r)
      ctx.arcTo(x + width, y + height, x, y + height, r)
      ctx.arcTo(x, y + height, x, y, r)
      ctx.arcTo(x, y, x + width, y, r)
      ctx.closePath()
      ctx.fill()
    }

    function paintCard(mesh, text, color) {
      const canvas = mesh.userData.canvas
      const ctx = canvas.getContext("2d")
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      if (!text) {
        mesh.visible = false
        return
      }
      ctx.fillStyle = "rgba(16,18,24,0.9)"
      fillRoundRect(ctx, 8, 8, canvas.width - 16, canvas.height - 16, 28)
      ctx.fillStyle = color
      ctx.font = mesh.userData.font
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      const lines = wrapLines(ctx, text, canvas.width - 48, mesh.userData.maxLines)
      const gap = 44
      const start = canvas.height / 2 - ((lines.length - 1) * gap) / 2
      for (let i = 0; i < lines.length; i += 1) ctx.fillText(lines[i], canvas.width / 2, start + i * gap)
      mesh.userData.texture.needsUpdate = true
      mesh.visible = true
    }

        const lift = hit ? (i % 5) * 0.18 - 0.36 : -0.2 - (i % 6) * 0.08

        mesh.position.set(0, 0, 0)
        mesh.material.color.set(hit ? (i % 2 ? 0x37d67a : 0xffd15c) : 0xff5a5a)

    function updateResultFx() {
      if (!resultFx || !resultFx.visible) return
      if (resultFx.userData.mode === "end") {
        const wave = (performance.now() - resultFx.userData.start) / 1000
        const gift = resultFx.userData.gift
        gift.position.y = Math.sin(wave * 2.2) * 0.06
        gift.rotation.y = wave * 0.7
        const actor = resultFx.userData.actor
        if (resultFx.userData.hit) {
          actor.position.set(0.46, Math.abs(Math.sin(wave * 3)) * 0.08, 0.08)
          actor.material.rotation = 0
        } else {
          actor.position.set(0.34, -0.16, 0.08)
          actor.material.rotation = 0.4
          resultFx.userData.regret.position.set(-0.16, 0.16, 0)
        }
        return
      }
      const elapsed = (performance.now() - resultFx.userData.start) / 1600
      const mark = resultFx.userData.hit ? resultFx.userData.ok : resultFx.userData.bad
      const pop = Math.min(elapsed / 0.16, 1)
      mark.scale.setScalar(0.35 + pop * 0.85)
      if (elapsed < 1) {
        mark.position.y = resultFx.userData.hit ? Math.sin(elapsed * Math.PI) * 0.14 : Math.sin(elapsed * 36) * 0.04
      }
      mark.userData.material.opacity = 1
      const ring = resultFx.userData.ring
      const fade = elapsed >= 1 ? 0 : (elapsed > 0.65 ? 1 - (elapsed - 0.65) / 0.35 : 1)
      if (ring.visible) {
        ring.scale.setScalar(0.35 + Math.min(elapsed, 1) * 2.4)
        ring.material.opacity = fade * 0.9
        if (elapsed >= 1) ring.visible = false
      }
      const actor = resultFx.userData.actor
      if (actor && actor.visible) {
        const hop = resultFx.userData.hit ? Math.abs(Math.sin(Math.min(elapsed, 1) * Math.PI * 2)) * 0.14 : 0
        const shake = resultFx.userData.hit ? 0 : Math.sin(elapsed * 30) * 0.04
        actor.position.set(0.4 + shake, -0.02 + hop, 0.08)
      }
      const travel = resultFx.userData.hit ? Math.min(elapsed, 1) * 1.25 : Math.min(elapsed, 1) * 0.7
      for (const mesh of resultFx.userData.sparks) {
        if (elapsed >= 1) {
          mesh.visible = false
          continue
        }
        mesh.position.copy(mesh.userData.dir).multiplyScalar(travel)
        mesh.scale.setScalar(Math.max(0.2, 1 - elapsed))
        mesh.material.opacity = fade
      }
    }

    function viewPoint(yaw, pitch, distance, side, drop) {
      const cp = Math.cos(pitch)
      const dir = new THREE.Vector3(-cp * Math.sin(yaw), Math.sin(pitch), -cp * Math.cos(yaw))
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0))
      if (right.lengthSq() < 0.0001) right.set(1, 0, 0)
      right.normalize()
      const point = dir.multiplyScalar(distance).addScaledVector(right, side)
      point.y += drop
      return point
    }

    function mascotScale(texture) {
      const aspect = texture.image.width / texture.image.height
      mascot.scale.set(36 * aspect, 36, 1)
    }

    function runMascot(yaw, pitch, spot) {
      if (!mascot) return
      const side = spot && spot.side != null ? spot.side : -22
      const drop = spot && spot.drop != null ? spot.drop : -12
      const distance = spot && spot.distance != null ? spot.distance : 112
      const from = mascot.visible ? mascot.position.clone() : viewPoint(yaw, pitch, 46, side - 8, drop - 6)
      const to = viewPoint(yaw, pitch, distance, side, drop)
      mascot.visible = true
      mascot.material.map = mascotMaps.stand
      mascotScale(mascotMaps.stand)
      mascot.position.copy(from)
      const point = spot && spot.pointLeft ? mascotMaps.pointLeft : mascotMaps.point
      mascotRun = { from, to, start: performance.now(), point }
    }

    function updateMascot() {
      if (!mascotRun || !mascot || !mascot.visible) return
      const t = Math.min((performance.now() - mascotRun.start) / 900, 1)
      const eased = t * t * (3 - 2 * t)
      mascot.position.lerpVectors(mascotRun.from, mascotRun.to, eased)
      if (t < 1) mascot.position.y += Math.abs(Math.sin(t * Math.PI * 4)) * 5
      else if (mascot.material.map !== mascotRun.point) {
        mascot.material.map = mascotRun.point
        mascotScale(mascotRun.point)
      }
    }

    function fold(text) {
      return text.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d")
    }

    function hasWord(text, word) {
      return (" " + text + " ").includes(" " + word + " ")
    }

    function scoreScene(heard, scene) {
      let score = 0
      for (const [term, weight] of scene.terms) {
        const hit = term.includes(" ") ? heard.includes(term) : hasWord(heard, term)
        if (hit) score += weight
      }
      return score
    }

    function bestOtherScene(text) {
      const heard = fold(text)
      let best = null
      for (const scene of LAB.scenes) {
        if (scene.id === currentLabId) continue
        const score = scoreScene(heard, scene)
        if (score > 0 && (!best || score > best.score)) best = { scene, score }
      }
      return best
    }

    function nextScene(id) {
      const index = LAB.scenes.findIndex((scene) => scene.id === id)
      return LAB.scenes[(index + 1) % LAB.scenes.length]

    function primeTourAudio() {
      const urls = ["audio/right.wav", "audio/wrong.wav", "audio/choose.wav"]
      for (let n = 0; n <= 5; n += 1) urls.push("audio/r8-score-" + n + ".wav")

      for (let n = 1; n <= 5; n += 1) urls.push("audio/num-" + n + ".wav")
      for (const route of ROUTES) {
        for (const id of route.stops) if (PLACES[id].audio) urls.push(PLACES[id].audio)
        if (!route.questions) continue
        for (const item of route.questions) {
          urls.push(item.qAudio)
          if (item.explainAudio) urls.push(item.explainAudio)
          for (const option of item.options) urls.push(option.audio)
        }
      }
      for (const group of QUIZ_GROUPS) {
        for (const item of group) {
          urls.push(item.qAudio)
          if (item.explainAudio) urls.push(item.explainAudio)
          for (const option of item.options) urls.push(option.audio)
        }
      }
      for (const url of new Set(urls)) primeClip(url)
    }

    function speakFiles(files, done) {
      const token = ++speakToken

      const list = files.map(voiced)

      const setTalking = (on) => {
        for (const node of speakers) if (node) node.classList.toggle("talking", on)
      }
      const playNext = () => {
        if (token !== speakToken) return
        if (index >= list.length) {
          setTalking(false)
          if (done) done()
          return
        }
        const url = list[index]
        index += 1
        primeClip(url).then((audio) => {
          if (token !== speakToken) return
          if (playing) {
            playing.onended = null
            playing.pause()
          }
          playing = audio
          audio.currentTime = 0
          audio.onended = playNext
          audio.play().catch(() => playNext())
        }).catch(() => playNext())
      }
      setTalking(true)
      playNext()
    }

    function rayFrom(controller) {

      const quaternion = new THREE.Quaternion()
      controller.getWorldPosition(origin)
      controller.getWorldQuaternion(quaternion)

      return new THREE.Raycaster(origin, direction)

    function waitLookAround(token, needSec) {
      lookMeter = {
        active: true,
        seconds: 0,
        lastYaw: rig.rotation.y,
        lastPitch: camera.rotation.x
      }
      return new Promise((resolve) => {
        let settled = false
        const finish = () => {
          if (settled) return
          settled = true
          lookMeter.active = false
          resolve()
        }
        tourSkip = finish
        const check = () => {
          if (token !== tourToken || settled) return
          if (lookMeter.seconds >= needSec) {
            finish()
            return
          }
          requestAnimationFrame(check)
        }
        requestAnimationFrame(check)
      })
    }

    function updateLookMeter() {
      if (!lookMeter.active) return
      const yaw = rig.rotation.y
      const pitch = camera.rotation.x
      const moved = Math.abs(yaw - lookMeter.lastYaw) + Math.abs(pitch - lookMeter.lastPitch)
      lookMeter.lastYaw = yaw
      lookMeter.lastPitch = pitch
      if (moved > 0.003) lookMeter.seconds += 1 / 60
    }

    function readHand(controller) {
      const gamepad = controller.userData.gamepad
      if (!gamepad) return
      const trigger = !!(gamepad.buttons[0] && gamepad.buttons[0].pressed)
      const secondary = !!(gamepad.buttons[5] && gamepad.buttons[5].pressed)
      if (controller.userData.handedness === "right") {
        if (rising(trigger, "rightTrigger")) {
          const ray = rayFrom(controller)
          const button = hitChoice(ray)
          if (button && !button.disabled) button.click()

    function onPointerDown(event) {
      drag = { x: event.clientX, y: event.clientY, moved: false }

    function onPointerMove(event) {
      if (!drag || renderer.xr.isPresenting) return
      const dx = event.clientX - drag.x
      const dy = event.clientY - drag.y
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true
      drag.x = event.clientX
      drag.y = event.clientY
      rig.rotation.y -= dx * 0.005
      camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - dy * 0.005, -1.1, 1.1)

        -((event.clientY - rect.top) / rect.height) * 2 + 1

    function shuffle(list) {
      const copy = list.slice()
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1))
        const hold = copy[i]
        copy[i] = copy[j]
        copy[j] = hold
      }
      return copy
    }

    function tourBox() {
      return {
        root: document.querySelector("#tour"),
        progress: document.querySelector("#tour-progress"),
        ko: document.querySelector("#tour-ko"),

        score: document.querySelector("#tour-score"),
        choices: document.querySelector("#tour-choices"),
        next: document.querySelector("#tour-next"),
        home: document.querySelector("#tour-home"),
        again: document.querySelector("#tour-again")
      }
    }

    }

      const skip = tourSkip
      tourToken += 1
      speakToken += 1

      if (skip) skip()
      if (playing) {
        playing.onended = null
        playing.pause()
      }
      const speaker = document.querySelector("#tour-speaker")
      if (speaker) speaker.classList.remove("talking")
      document.querySelector("#tour-muhan").classList.remove("open", "talking")

      closeSpotBox()
      if (resultFx) resultFx.visible = false
      voiceOn = false
      hidePrize()
      setSpeaker()
      const box = tourBox()
      box.root.classList.remove("open")
      box.ko.textContent = ""
      box.text.textContent = ""
      box.progress.textContent = ""
      box.choices.replaceChildren()
      box.next.hidden = true
      box.home.hidden = true
      box.again.hidden = true
      box.score.textContent = ""
      setTouring(false)
      document.querySelector("#start-tour").textContent = "Bắt đầu"
    }

    function speakClips(files, token) {
      return new Promise((resolve) => {
        const earlier = tourSkip
        let settled = false
        const finish = () => {
          if (settled) return
          settled = true
          resolve()
        }
        tourSkip = () => {
          speakToken += 1
          if (playing) {
            playing.onended = null
            playing.pause()
          }
          const speaker = document.querySelector("#tour-speaker")
          if (speaker) speaker.classList.remove("talking")
          finish()
        }
        if (earlier) earlier()
        if (token !== tourToken) {
          finish()
          return
        }
        speakFiles(files, finish)
      })
    }

    function pickQuiz() {
      const route = ROUTES[routeIndex]
      if (route.questions) return route.questions.slice()
      const groups = route.quiz.map((index) => QUIZ_GROUPS[index])
      return shuffle(groups).slice(0, 4).map((group) => group[Math.floor(Math.random() * group.length)])
    }

    function deal(item) {
      const letters = ["A", "B", "C"]
      return shuffle(item.options.map((option, index) => ({
        text: option.vi,
        ko: option.ko,
        en: option.en,
        audio: option.audio,
        say: option.say,
        correct: index === 0
      }))).map((choice, index) => ({
        letter: letters[index],
        text: choice.text,
        ko: choice.ko,
        en: choice.en,
        audio: choice.audio,
        say: choice.say,
        correct: choice.correct
      }))
    }

    function showChoices(round, token) {
      if (resultFx) resultFx.visible = false
      const box = tourBox()
      box.choices.replaceChildren()
      box.next.hidden = true
      for (const choice of round.choices) {
        const button = document.createElement("button")
        button.type = "button"
        const spoken = optionSpoken(choice)
        button.textContent = voiceParts().lang === "ko"
          ? choice.letter + ". " + spoken + " — " + choice.text
          : choice.letter + ". " + spoken
        button.addEventListener("click", () => gradeRound(round, choice.letter, token))
        box.choices.appendChild(button)
      }
    }

    async function gradeRound(round, letter, token) {
      if (quizBusy || token !== tourToken) return
      quizBusy = true
      const box = tourBox()
      const picked = round.choices.find((choice) => choice.letter === letter)
      const hit = !!(picked && picked.correct)
      if (hit) round.score = 1
      playResultFx(hit)
      for (const button of box.choices.querySelectorAll("button")) button.disabled = true
      box.next.hidden = false
      let moved = false
      const moveOn = () => {
        if (moved || token !== tourToken) return
        moved = true
        if (tourSkip) tourSkip()
        quizBusy = false
        round.done(hit)
      }
      const shown = performance.now()
      box.next.onclick = moveOn
      await speakClips(hit ? ["audio/right.wav"] : ["audio/wrong.wav", round.correct.audio], token)
      if (moved || token !== tourToken) return
      if (round.explainAudio) {
        showSpoken(box, explainSpoken(round), round.explain)
        await speakClips([round.explainAudio], token)
      }
      if (moved || token !== tourToken) return
      const remain = 1200 - (performance.now() - shown)
      if (remain > 0) await new Promise((resolve) => setTimeout(resolve, remain))
      moveOn()
    }

    async function askRounds(token) {
      const box = tourBox()
      box.progress.textContent = ROUTES[routeIndex].name
      const items = pickQuiz()
      let correct = 0
      const recap = []
      for (let index = 0; index < items.length; index += 1) {
        if (token !== tourToken) return
        const item = items[index]
        const choices = deal(item)
        const round = {
          choices,
          correct: choices.find((choice) => choice.correct),
          score: 0,
          explainKo: item.explainKo,
          explain: item.explain,
          explainEn: item.explainEn,
          explainAudio: item.explainAudio,
          done: null
        }
        box.score.textContent = "Câu " + (index + 1) + "/" + items.length + ". Đúng " + correct + "."
        showSpoken(box, questionSpoken(item), item.q)
        showChoices(round, token)
        const files = ["audio/num-" + (index + 1) + ".wav", item.qAudio]
        for (const choice of choices) files.push("audio/letter-" + choice.letter.toLowerCase() + ".wav", choice.audio)
        const answered = new Promise((resolve) => {
          round.done = resolve
        })
        await speakClips(files, token)
        if (token !== tourToken) return
        const hit = await answered
        if (token !== tourToken) return
        if (hit) correct += 1
        recap.push((hit ? "Đúng. " : "Chưa đúng. ") + item.q)
      }
      if (token !== tourToken) return
      box.choices.replaceChildren()
      box.next.hidden = true
      box.home.hidden = false
      if (ROUTES[routeIndex].questions) {
        const won = correct >= 3
        const lang = voiceParts().lang
        const ending = won ? PRIZE_LINE[lang] : REGRET_LINE[lang]
        showSpoken(box, scoreLine(lang, correct) + " " + ending, (won ? PRIZE_LINE.vi : REGRET_LINE.vi))
        box.score.textContent = "Bạn đúng " + correct + "/5."
        showPrize(won)
        playEndFx(won)
        await speakClips(["audio/r8-score-" + correct + ".wav", won ? "audio/r8-prize.wav" : "audio/r8-regret.wav"], token)
        if (token !== tourToken) return
        await speakMuhan(token)
        return
      }
      hidePrize()
      if (resultFx) resultFx.visible = false
      box.score.textContent = "Bạn đúng " + correct + "/4."
      const oldLine = recap.join(" ") + " PR chọn mốc quà: từ 3/4, hoặc chỉ 4/4."
      if (voiceParts().lang === "ko") {
        box.ko.textContent = SCORE_KO[correct]
        box.text.textContent = oldLine
      } else {
        box.ko.textContent = ""
        box.text.textContent = oldLine
      }
      await speakClips(["audio/score-" + correct + ".wav"], token)
      if (token !== tourToken) return
      await speakMuhan(token)
    }

    function holdScene(token, ms) {
      return new Promise((resolve) => {
        let settled = false
        const finish = () => {
          if (settled) return
          settled = true
          resolve()
        }
        tourSkip = finish
        setTimeout(() => {
          if (token === tourToken) finish()
        }, ms)
      })
    }

    async function startGuided() {
      const token = ++tourToken
      voiceOn = true
      setSpeaker()
      hidePrize()
      document.querySelector("#tour-muhan").classList.remove("open", "talking")
      if (resultFx) resultFx.visible = false
      speakToken += 1
      quizBusy = false
      clearSpots()
      closeSpotBox()
      if (playing) {
        playing.onended = null
        playing.pause()
      }
      document.querySelector("#route").classList.remove("open")
      document.querySelector("#lab").classList.remove("open")
      document.querySelector("#audience").classList.remove("open")
      const box = tourBox()
      box.root.classList.add("open")
      box.home.hidden = false
      box.again.hidden = false
      box.score.textContent = ""
      box.progress.textContent = ROUTES[routeIndex].name
      setTouring(true)
      document.querySelector("#start-tour").textContent = "Làm lại"
      const stops = ROUTES[routeIndex].stops
      await goTo("overview")
      box.progress.textContent = "Nhìn quanh"
      showSpoken(box, LOOK_LINE[voiceParts().lang] || LOOK_LINE.vi, LOOK_LINE.vi)
      box.choices.replaceChildren()
      box.next.hidden = false
      box.next.onclick = () => {
        if (tourSkip) tourSkip()
      }
      await speakClips(["audio/look-around.wav"], token)
      if (token !== tourToken) return
      await new Promise((resolve) => {
        let settled = false
        const finish = () => {
          if (settled) return
          settled = true
          resolve()
        }
        tourSkip = finish
      })
      if (token !== tourToken) return
      for (let index = 0; index < stops.length; index += 1) {
        if (token !== tourToken) return
        const id = stops[index]
        const place = routePlace(id)
        await goTo(id)
        clearSpots()
        box.root.classList.add("open")
        const point = EIGHT_POINT[id] || (index + 1)
        box.progress.textContent = ROUTES[routeIndex].questions
          ? place.title + " · điểm " + point + "/8"
          : place.title + " · cảnh " + (index + 1) + "/" + stops.length
        showSpoken(box, placeSpoken(place), place.line)
        box.choices.replaceChildren()
        box.next.hidden = false
        box.home.hidden = false
        let skipped = false
        box.next.onclick = () => {
          skipped = true
          if (tourSkip) tourSkip()
        }
        if (place.audio) await speakClips([place.audio], token)
        if (token !== tourToken) return
        if (!skipped && ROUTES[routeIndex].questions && SPOTS[id]) {
          await exploreSpots(id, token)
          if (token !== tourToken) return
        } else if (!skipped) {
          await holdScene(token, 15000)
        }
      }
      if (token !== tourToken) return
      await askRounds(token)
    }

    async function startQuizOnly() {
      document.querySelector("#route").classList.remove("open")
      const token = ++tourToken
      voiceOn = true
      setSpeaker()
      hidePrize()
      document.querySelector("#tour-muhan").classList.remove("open", "talking")
      if (resultFx) resultFx.visible = false
      speakToken += 1
      quizBusy = false
      if (playing) {
        playing.onended = null
        playing.pause()
      }
      document.querySelector("#lab").classList.remove("open")
      const box = tourBox()
      box.root.classList.add("open")
      box.home.hidden = false
      box.again.hidden = false
      box.score.textContent = ""
      box.progress.textContent = ROUTES[routeIndex].name
      box.choices.replaceChildren()
      setTouring(true)
      document.querySelector("#start-tour").textContent = "Làm lại"
      await askRounds(token)
    }

    function fillRoute() {
      const list = document.querySelector("#route-list")
      list.replaceChildren()
      ROUTES.forEach((route, index) => {
        const block = document.createElement("div")
        block.className = "route"
        block.classList.toggle("on", index === routeIndex)
        const button = document.createElement("button")
        button.type = "button"
        button.className = "card"
        button.classList.toggle("on", index === routeIndex)
        const name = document.createElement("span")
        name.className = "name"
        name.textContent = route.name
        const count = document.createElement("span")
        count.className = "count"
        count.textContent = route.questions ? "9 cảnh" : route.stops.length + " cảnh"
        button.append(name, count)
        button.addEventListener("click", () => {
          routeIndex = index
          ROUTES.forEach((item) => { item.voiceOpen = false })
          fillRoute()
        })
        block.appendChild(button)
        if (index === routeIndex) {
          const choices = [["ko-f", "Hàn · Nữ"], ["ko-m", "Hàn · Nam"], ["vi-f", "Việt · Nữ"], ["vi-m", "Việt · Nam"], ["en-f", "Anh · Nữ"], ["en-m", "Anh · Nam"]]
          const current = choices.find(([id]) => id === route.voice) || choices[0]
          const toggle = document.createElement("button")
          toggle.type = "button"
          toggle.className = "voice-current"
          toggle.classList.toggle("on-f", current[0].endsWith("-f"))
          toggle.classList.toggle("on-m", current[0].endsWith("-m"))
          toggle.textContent = "Đổi ngôn ngữ: " + current[1] + (route.voiceOpen ? " ▴" : " ▾")
          toggle.addEventListener("click", () => {
            route.voiceOpen = !route.voiceOpen
            fillRoute()
          })
          block.appendChild(toggle)
          const voices = document.createElement("div")
          voices.className = "voices"
          voices.classList.toggle("open", !!route.voiceOpen)
          for (const [id, label] of choices) {
            const pick = document.createElement("button")
            pick.type = "button"
            pick.textContent = label
            pick.classList.toggle("on-f", route.voice === id && id.endsWith("-f"))
            pick.classList.toggle("on-m", route.voice === id && id.endsWith("-m"))
            pick.addEventListener("click", () => {
              route.voice = id
              route.voiceOpen = false
              setSpeaker()
              fillRoute()
            })
            voices.appendChild(pick)
          }
          block.appendChild(voices)
          const stops = document.createElement("div")
          stops.className = "stops"
          stops.textContent = route.stops.map((id) => PLACES[id].title).join(" · ")
          block.appendChild(stops)
        }
        list.appendChild(block)
      })
      const quiz = document.createElement("button")
      quiz.type = "button"
      quiz.className = "quiz"
      quiz.textContent = "Câu hỏi của lộ trình này"
      quiz.addEventListener("click", beginQuiz)
      list.appendChild(quiz)
    }

    document.querySelector("#speak").addEventListener("click", sayCurrent)
    document.querySelector("#back").addEventListener("click", returnOverview)
    document.querySelector("#open-lab").addEventListener("click", startLab)
    document.querySelector("#open-route").addEventListener("click", () => {
      document.querySelector("#route").classList.toggle("open")
    })
    function beginTour() {
      pendingStart = "tour"
      if (!audienceRole) {
        document.querySelector("#audience").classList.add("open")
        return
      }
      startGuided()
    }

    function beginQuiz() {
      pendingStart = "quiz"
      if (!audienceRole) {
        document.querySelector("#audience").classList.add("open")
        return
      }
      startQuizOnly()
    }

    document.querySelector("#start-tour").addEventListener("click", beginTour)
    document.querySelector("#tour-home").addEventListener("click", returnOverview)
    document.querySelector("#tour-again").addEventListener("click", beginTour)
    document.querySelector("#spot-box .spot-close").addEventListener("click", closeSpotBox)
    for (const button of document.querySelectorAll("#audience .roles button")) {
      button.addEventListener("click", () => {
        audienceRole = button.dataset.role
        for (const item of document.querySelectorAll("#audience .roles button")) {
          item.classList.toggle("on", item === button)
        }
        document.querySelector("#audience").classList.remove("open")
        if (pendingStart === "quiz") startQuizOnly()
        else startGuided()
      })
    }
    fillRoute()
    document.querySelector("#mic").addEventListener("click", listenVietnamese)
    primeLabAudio()
    primeTourAudio()

    makePins()
    makeCaption()
    makeVrBoard()
    makeResultFx()
    addController(0)
    addController(1)
    spotIcon = await loadTexture("./img/zoom_blue.png")
    mascotMaps.stand = await loadTexture("./img/moohan.png")
    mascotMaps.point = await loadTexture("./img/moohan-point.png")
    mascotMaps.pointLeft = await loadTexture("./img/moohan-point-left.png")
    mascot = new THREE.Sprite(new THREE.SpriteMaterial({
      map: mascotMaps.stand,
      transparent: true,
      alphaTest: 0.3,
      depthWrite: false
    }))
    mascot.visible = false
    scene.add(mascot)
    const aiTexture = await loadTexture("./pano/ai.png")
    makeAiPlane(aiTexture)
    await goTo("overview")
    STATUS.textContent = "Kéo để nhìn. Bấm ghim là tay phải. Nút nói và phím F là tay trái. Phím Y là về."
    renderer.setAnimationLoop(frame)
  </script>
</body>
</html>
